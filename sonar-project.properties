# SonarQube Project Configuration
# Documentation: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/scanners/sonarscanner/

# Required project identification
sonar.projectKey=portfolio-rapterxcode
sonar.projectName=Portfolio RapterXCode
sonar.projectVersion=1.0.0

# Source directories and analysis scope
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/*.d.ts,**/assets/**,**/*.docx,**/*.pdf

# Character encoding
sonar.sourceEncoding=UTF-8

# Default SonarQube Server URL (uncomment and customize as needed)
# sonar.host.url=http://localhost:9000
# sonar.token=your_sonarqube_token_here
