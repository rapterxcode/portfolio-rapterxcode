server {
    listen 80;
    server_name _;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /portfolio-rapterxcode/;
    }

    location = /portfolio-rapterxcode {
        return 301 /portfolio-rapterxcode/;
    }

    location /portfolio-rapterxcode/ {
        try_files $uri $uri/ /portfolio-rapterxcode/index.html;
    }
}
